<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D9DFE8; --text:#1C2433; --muted:#5D6778;
  --ink:#2450C8; --ink-soft:#E3EAFB; --sun:#FFC93C; --sun-soft:#FFF4D6; --sky:#5AA9E6; --sky-soft:#E4F2FC;
  --good:#1E9E3A; --warn:#E39B00; --bad:#D23B3B; --good-t:rgba(30,158,58,.14); --warn-t:rgba(242,169,0,.18); --bad-t:rgba(210,59,59,.14);
  --paper:#FCFDFF; --rule:#C9DDF3; --margin:#F2B8B8; --pencil:#3A3F4B;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.07);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161F; --surface:#1A212D; --surface-2:#212A38; --line:#2F3A4C; --text:#E8EDF5; --muted:#9AA6B8;
    --ink:#7EA2FF; --ink-soft:#22325A; --sun:#FFD25E; --sun-soft:#3A3220; --sky:#7CC0F2; --sky-soft:#1D3347;
    --good-t:rgba(46,190,80,.2); --warn-t:rgba(242,169,0,.22); --bad-t:rgba(230,80,80,.22);
    --paper:#EEF2F8; --rule:#B9CCE3; --margin:#E3A3A3; --pencil:#2E333D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A212D; --surface-2:#212A38; --line:#2F3A4C; --text:#E8EDF5; --muted:#9AA6B8;
  --ink:#7EA2FF; --ink-soft:#22325A; --sun:#FFD25E; --sun-soft:#3A3220; --sky:#7CC0F2; --sky-soft:#1D3347;
  --good-t:rgba(46,190,80,.2); --warn-t:rgba(242,169,0,.22); --bad-t:rgba(230,80,80,.22);
  --paper:#EEF2F8; --rule:#B9CCE3; --margin:#E3A3A3; --pencil:#2E333D; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* demo bar */
.demo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-right:auto}
.brand-mark{width:26px;height:26px;border-radius:7px;background:conic-gradient(var(--good) 0 50%,var(--warn) 0 75%,var(--bad) 0);display:grid;place-items:center}
.brand-mark span{width:12px;height:12px;border-radius:3px;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

#app{padding:22px 16px 40px}

/* start */
.start{max-width:760px;margin:6vh auto 0;text-align:center}
.start h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 10px}
.start p{color:var(--muted);margin:0 auto 28px;max-width:52ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:left;box-shadow:var(--shadow)}
.role b{display:block;font-size:18px;margin:10px 0 4px}
.role span{color:var(--muted);font-size:14px}

.s-h{font-size:16px;font-weight:800;margin:20px 0 10px}
.exam{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--surface);width:100%;text-align:left}

.exam b{display:block}
.exam small{color:var(--muted)}
.chip{margin-left:auto;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}

.mini-chart{border:1px solid var(--line);border-radius:16px;padding:12px}

.lbl{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px}

.thumbs{display:flex;gap:8px;margin:14px 0}
.thumb{width:58px;height:74px;border-radius:10px;border:2px solid var(--line);background:var(--paper) repeating-linear-gradient(transparent 0 9px,var(--rule) 9px 10px);display:grid;place-items:end center;font-size:11px;font-weight:800;color:#333;padding-bottom:3px}
.thumb.blur{border-color:var(--warn);filter:blur(.6px)}
.thumb.add{background:var(--surface-2);border-style:dashed;place-items:center;font-size:22px;color:var(--muted)}
.celebrate{text-align:center;padding:40px 10px}
.celebrate .tick{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--good-t);color:var(--good);display:grid;place-items:center;font-size:42px}

.celebrate p{color:var(--muted);margin:0 0 20px}
.msg{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;background:var(--surface)}

.msg .av{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:800;flex:none}

.empty{text-align:center;color:var(--muted);padding:40px 10px}

.prac .opts button.right{border-color:var(--good);background:var(--good-t)}
.prac .opts button.wrong{border-color:var(--bad);background:var(--bad-t)}

.verify{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}

function chart(vals,w=320,h=120){

      ${fl==='open'?`<div class="btns"><button class="tbtn danger" data-act="flag" data-v="confirmed" ${pub?'disabled':''}>Confirm</button><button class="tbtn" data-act="flag" data-v="dismissed" ${pub?'disabled':''}>Dismiss</button></div>`:
        `<button class="tbtn" data-act="flag" data-v="open" ${pub?'disabled':''}>Undo</button>`}
      ${fl==='confirmed'?`<div class="fu" style="margin-top:12px"><b>Follow-up</b><label><input type="checkbox" data-act="fu" data-v="fuTalk" ${S.fuTalk?'checked':''}> Talk with Youssef</label><label><input type="checkbox" data-act="fu" data-v="fuParents" ${S.fuParents?'checked':''}> Notify parents if it continues</label></div>`:''}
    </div></div></div>`);
};
V['t-profile'] = () => tShell('t-profile',`<div class="t-head"><h2>Youssef Ahmed</h2><span class="sub">Grade 3</span></div>
  <div class="confirm"><div class="card"><h3 style="margin-top:0">Grades</h3>${chart(grades(),520,200)}</div>
  <div class="side"><div class="card"><h3>Recurring mistakes</h3><table><tbody><tr><td>Comparing fractions</td><td><b>3 of 4</b> quizzes</td></tr><tr><td>Writing fractions clearly</td><td><b>2 of 4</b> quizzes</td></tr></tbody></table></div>
  <div class="card"><h3>Red flags</h3><p class="muted" style="margin:0">${S.flag==='confirmed'?`Fractions · confirmed${S.fuTalk?' · talk planned':''}${S.fuParents?' · parents notified if it continues':''}`:S.flag==='dismissed'?'Fractions · dismissed':'Fractions · open'}</p></div></div></div>`);

/* ---------- parent ---------- */
V['p-home'] = () => `<div class="parent">${phone(`<div class="s-top"><h2>Youssef’s progress</h2></div><div class="s-body">
  ${S.status==='published'?`<div class="grade-card"><div class="g">${total()} / 10</div><small>Math quiz 4 · checked by Ms. Mariam</small></div>`:`<div class="locked">No new grades yet.</div>`}
  <div class="s-h">Grades</div><div class="mini-chart">${chart(grades())}</div>
  ${S.status==='published'&&S.flag==='confirmed'?`<div class="s-h">From the teacher</div><div class="weak"><span style="font-size:22px">🚩</span><b>Youssef needs a bit of extra support in fractions.${S.fuParents?' Ms. Mariam will contact you if it continues.':''}</b></div>`:''}
  </div>`,null)}</div>`;

V['start'] = () => `<div class="start"><h1>Exam checking where the teacher stays in charge</h1>
  <p>Students photograph their handwritten exams. ClearMark reads them, shows the teacher exactly which answers it is unsure about, and nothing reaches a child without her approval.</p>
  <div class="roles"><button class="role" data-act="role" data-v="s-home"><div class="ic" style="background:var(--sun-soft)">🎒</div><b>Student</b><span>Upload an exam and see results</span></button>
  <button class="role" data-act="role" data-v="t-dash"><div class="ic" style="background:var(--ink-soft)">🧑‍🏫</div><b>Teacher</b><span>Verify, grade and follow up</span></button>
  <button class="role" data-act="role" data-v="p-home"><div class="ic" style="background:var(--good-t)">👪</div><b>Parent</b><span>Follow your child’s progress</span></button></div></div>`;

/* ---------- render ---------- */
function render(){
  const v=view(); const app=document.getElementById('app');
  app.classList.toggle('is-phone', v.startsWith('s-')||v==='p-home');
  app.innerHTML=V[v]();
  const r=v.startsWith('s-')?'r-s':v.startsWith('t-')?'r-t':v.startsWith('p-')?'r-p':null;
  document.getElementById('logout').style.display = v==='start' ? 'none' : '';
  document.documentElement.lang = v.startsWith('s-') ? S.lang : 'en';
  if(v==='s-clarify') setupPad();
  window.scrollTo(0,0);
}
let padCtx=null;
function setupPad(){
  const c=document.getElementById('pad'); if(!c) return;
  const rect=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=rect.width*dpr; c.height=rect.height*dpr; padCtx=c.getContext('2d'); padCtx.scale(dpr,dpr);
  padCtx.lineWidth=4; padCtx.lineCap='round'; padCtx.strokeStyle='#203A86'; c.dataset.dirty='';
  let drawing=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);padCtx.beginPath();padCtx.moveTo(x,y)};
  c.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);padCtx.lineTo(x,y);padCtx.stroke();c.dataset.dirty='1'};
  c.onpointerup=()=>drawing=false;
}

/* ---------- actions ---------- */
const A = {
  go:v=>go(v), role:v=>go(v),
  logout:()=>go('start'),
  lang:v=>{S.lang=v;save();render()},
  startUpload:()=>{S.step=1;S.pages=[];save();go('s-upload')},
  step:v=>{S.step=+v;save();render()},
  photo:()=>{const vf=document.getElementById('vf');S.pages.push({blur:S.pages.length===0&&!S.blurDone});save();render();const n=document.getElementById('vf');if(n){n.classList.add('flash')}},
  retake:()=>{const last=S.pages.findIndex(p=>p.blur);const i=last>=0?last:S.pages.length-1;S.pages[i]={blur:false};S.blurDone=true;save();render()},
  submitExam:()=>{S.status='submitted';S.step=3;save();go('s-sent')},
  cmode:v=>{S.cmode=v;save();render()},
  clearPad:()=>{const c=document.getElementById('pad');if(c){padCtx.clearRect(0,0,c.width,c.height);c.dataset.dirty=''}},
  sendReply:()=>{
    if((S.cmode||'type')==='type'){const a=document.getElementById('fa').value.trim(),b=document.getElementById('fb').value.trim();
      if(!a||!b){toast(S.lang==='de'?'Bitte beide Zahlen eingeben.':'Please fill in both numbers.');return}
      S.reply={kind:'text',v:a+'/'+b};}
    else{const c=document.getElementById('pad');if(!c.dataset.dirty){toast(S.lang==='de'?'Bitte zuerst zeichnen.':'Please draw your answer first.');return}S.reply={kind:'img',v:c.toDataURL('image/png')};}
    S.clarify='replied';save();render();
  },
  prac:v=>{S.pracPick=v;save();render()},
  sel:v=>{S.sel=v;save();render()},
  jump:()=>{const order=[...S.regions.filter(r=>!r.done&&r.conf==='bad'),...S.regions.filter(r=>!r.done&&r.conf==='warn')];if(order.length){S.sel=order[0].id;save();render()}},
  pick:v=>{const r=S.regions.find(x=>x.id===S.sel);r.text=v;r.done=true;save();render();toast(r.id+' set to '+v)},
  accept:()=>{const r=S.regions.find(x=>x.id===S.sel);r.done=true;save();render();toast(r.id+' accepted')},
  focusEdit:()=>{const i=document.querySelector(`[data-edit="${S.sel}"]`);if(i){i.focus();i.select()}},
  ask:()=>{S.clarify='asked';S.notifs.push('clarify');save();render();toast('Request sent to Youssef')},
  useReply:()=>{const r=S.regions[2];r.text=S.reply.v;r.done=true;S.clarify='used';save();render();toast('Q3 set to '+S.reply.v)},
  confirmText:()=>{const left=S.regions.filter(r=>!r.done);
    if(left.length){modal(`${left.length} answer${left.length>1?'s':''} still need checking`,`${left.map(r=>r.id).join(' and ')} ${left.length>1?'are':'is'} still marked unsure. Check ${left.length>1?'them':'it'} before grading so the AI grades the right text.`,'Show me',()=>{S.sel=left[0].id;save();render()});return}
    S.status='verified';save();toast('Text confirmed');go('t-confirm')},
  mk:(v,el)=>{const r=S.regions.find(x=>x.id===v);const n=Math.max(0,Math.min(2,mark(r)+ +el.dataset.d));if(n===aiMark(r))delete S.marks[v];else S.marks[v]=n;save();render()},
  flag:v=>{S.flag=v;if(v!=='confirmed'){S.fuTalk=false;S.fuParents=false}save();render()},
  fu:(v,el)=>{S[v]=el.checked;save()},
  saveDraft:()=>{S.feedback=document.getElementById('fbk').value;save();toast('Draft saved')},
  publish:()=>{S.feedback=document.getElementById('fbk').value;save();
    if(S.flag==='open'){modal('Red flag still open','Confirm or dismiss the fractions red flag before publishing, so Youssef sees the right weak spots.','Got it',()=>{});return}
    modal('Publish to Youssef?',`He will see his grade (${total()}/10), your feedback and his weak spots.`,'Publish',()=>{S.status='published';S.notifs.push('graded');save();render();toast('Published')})}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.type==='checkbox') return;
  const f=A[el.dataset.act]; if(f){e.preventDefault();f(el.dataset.v,el)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='fu') A.fu(el.dataset.v,el);
  if(el.dataset.edit){const r=S.regions.find(x=>x.id===el.dataset.edit);r.text=el.value;r.done=true;save();render()}
});
render();
</script>
</body>
</html>
